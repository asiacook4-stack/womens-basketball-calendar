name: Update and publish basketball calendar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: calendar-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test calendar safeguards
        run: python -m unittest test_calendar -v
      - name: Fetch and validate every official schedule
        run: python update_calendar.py
      - name: Save validated calendar state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/calendar.ics docs/status.json state.json link-checks.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified official basketball schedules'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish HTTPS subscription
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Explain failure
        if: failure()
        run: echo 'Update failed. Last deployed calendar remains available. Review the Actions logs; do not replace the feed with partial data.' >> "$GITHUB_STEP_SUMMARY"
